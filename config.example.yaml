listen:
  port: 9000

upstream:
  host: "example.com"

# Optional overrides. Every omitted key uses a fixed built-in default.
# version: 1
# protocols: [tcp, udp] # names registered by built-in protocol modules
# listen:
#   host: "*"
#   port: 9000
# upstream:
#   host: "example.com"
#   port: 9000
# runtime:
#   workerThreads: 4
# timeouts:
#   connectSeconds: 5
#   tcpIdleSeconds: 300
#   udpSessionSeconds: 60
#   shutdownGraceSeconds: 10
# limits:
#   tcpListenBacklog: 4096
#   maxTCPBufferedBytes: 134217728
#   maxUDPAssociations: 2048
#   maxUDPPendingDatagrams: 64     # legacy: unused by the batched UDP transport
#   maxUDPPendingBytes: 524288     # legacy: unused by the batched UDP transport
# performance:
#   tcpSockmapAcceleration: auto     # auto skips loopback upstreams; set
#                                    # enabled to force the attempt
#   udpSockmapAcceleration: auto     # starts userspace; after five 1s windows
#                                    # with >=200 datagrams averaging >=256 B,
#                                    # a non-loopback rule may probe sockmap;
#                                    # failures cool down for 30s;
#                                    # set enabled to force a best-effort attempt
#   udpSocketBufferBytes: 4194304   # 0 keeps kernel defaults; clamped to
#                                   # net.core.rmem_max/wmem_max without CAP_NET_ADMIN
#   udpDatagramBufferBytes: 65536   # per-slot receive buffer of the batched UDP
#                                   # relay (576..65536); smaller values improve
#                                   # cache locality, larger datagrams truncate
#   udpIOThreads: 1                 # UDP relay threads
#   threadCpuAffinity: none         # CPU pinning for TCP workers and UDP I/O
#                                   # threads: none | sequential | [list]
#                                   #   none: leave scheduling to the kernel
#                                   #   sequential: thread i binds to CPU i
#                                   #     (modulo allowed CPUs)
#                                   #   [0, 2, 4]: thread i binds to
#                                   #     list[i % len]; improves cache
#                                   #     locality on multi-core/NUMA hosts,
#                                   #     may hurt on shared machines
# logging:
#   level: info

# Optional rules module (disabled unless written): multiple independent
# listen -> upstreams rules in one process. Cannot be combined with the
# top-level listen/upstream above; timeouts/limits set here are global
# defaults each rule may override.
# rules:
#   - listen: { host: "*", port: 9000 }
#     protocols: [tcp, udp]              # default: inherit global protocols
#     upstreams:
#       - { host: "a.example.com", port: 9000 }            # port defaults to
#       - { host: "b.example.com", port: 9000, weight: 2 } # the listen port
#     balance: round_robin   # round_robin | source_hash |
#                            # weighted_round_robin
#     timeouts: { tcpIdleSeconds: 600 }        # optional per-rule overrides
#     limits: { maxTCPBufferedBytes: 8388608 } # tcpListenBacklog and
#                                              # maxUDPAssociations too
#   - listen: { host: "127.0.0.1", port: 53 }
#     protocols: [udp]
#     upstreams: [ { host: "8.8.8.8", port: 53 } ]
# Two rules must not share the same listen address and protocol. Upstream
# health is passive: 3 consecutive failures park an upstream for 10s
# (exponential backoff, 5min cap), then it rejoins automatically.

# ---------------------------------------------------------------------------
# Multi-instance operation (optional)
# ---------------------------------------------------------------------------
# Several independent curtsy processes can run side by side, each with its own
# configuration file, listen addresses and hot reload. An instance is just a
# process identity: the --instance NAME flag only prefixes every log line with
# instance=NAME, sets the process name, and names the systemd unit; it never
# affects configuration, routing or forwarding. Allowed charset is
# [A-Za-z0-9._-], at most 64 bytes (a safe subset of systemd template unit
# instance names).
#
# systemd template:
#   # /etc/curtsy/instances/edge.yaml and /etc/curtsy/instances/dmz.yaml
#   sudo systemctl enable --now curtsy@edge curtsy@dmz
#   # each instance runs:
#   #   curtsy --instance edge --config /etc/curtsy/instances/edge.yaml
# The plain curtsy.service unit keeps using /etc/curtsy/config.yaml as the
# default single instance.
#
# command line:
#   curtsy --config edge.yaml --instance edge
#   curtsy --config dmz.yaml --instance dmz
#
# Port sharing: sockets on the same listen address:port carry SO_REUSEPORT,
# which the kernel only groups across sockets owned by the SAME effective UID.
# systemd's DynamicUser=true gives each template instance a distinct uid, so
# two instances cannot share one listen address:port (the second bind fails).
# To share a port across instances, set a fixed User= (or run without
# DynamicUser as one user); a shared port is an intentional scale-out with the
# kernel/BPF distributing flows, not automatic conflict detection. When
# sharing a port, keep each instance's workerThreads equal so the reuseport
# eBPF modulus (per-instance worker count) and the kernel hash do not mix into
# a lopsided distribution.
#
# Resource planning: workerThreads and limits are fixed per instance, so the
# values of every instance add up on one host. Prefer explicit values sized
# for the whole machine instead of relying on the built-in per-instance
# defaults.
#
# eBPF: sockmap and reuseport programs are loaded per process/socket, so
# multiple instances coexist without kernel-level conflicts.
