version: 1
protocols: [tcp, udp]

listen:
  host: "*"
  port: 9000

upstream:
  host: "example.com"
  port: 9000

timeouts:
  connectSeconds: 5
  tcpIdleSeconds: 300
  udpSessionSeconds: 60
  shutdownGraceSeconds: 10

limits:
  tcpListenBacklog: 4096
  maxTCPBufferedBytes: 268435456
  maxUDPAssociations: 4096

performance:
  tcpSockmapAcceleration: auto

logging:
  level: info
