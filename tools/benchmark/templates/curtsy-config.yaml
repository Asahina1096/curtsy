# Curtsy benchmark configuration template.
#
# The harness (tools/benchmark/run-benchmark.sh) substitutes the __X__ markers
# below and feeds the result to `curtsy --config <file> --check-config`, then
# to `curtsy --config <file>` for the proxied runs. Nothing outside
# tools/benchmark is touched; system settings are never changed by the harness.
#
# Every limit is fixed at startup, so benchmark numbers are reproducible;
# sockmap acceleration follows --acceleration.
listen:
  host: "__LISTEN_HOST__"
  port: __LISTEN_PORT__

upstream:
  host: "__UPSTREAM_HOST__"
  port: __UPSTREAM_PORT__

protocols: [__PROTOCOLS__]

runtime:
  workerThreads: __WORKER_THREADS__

performance:
  tcpSockmapAcceleration: __TCP_SOCKMAP__
  udpSockmapAcceleration: __UDP_SOCKMAP__
  udpSocketBufferBytes: __UDP_SOCK_BUF__
